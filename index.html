<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ألعابي - Games Zone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">🎮 ألعابي</div>
        <input type="text" placeholder="ابحث عن لعبة..." class="search-bar">
    </header>

    <main class="container">
        <h2>🔥 ألعاب سيارات وسرعة</h2>
        <div class="games-grid">
            <a href="play.html?game=car1" class="game-card">
                <img src="https://picsum.photos/200/150?random=1" alt="سباق السيارات">
                <div class="game-title">سباق السيارات الخارقة</div>
            </a>
            <a href="play.html?game=car2" class="game-card">
                <img src="https://picsum.photos/200/150?random=2" alt="تحدي التفحيط">
                <div class="game-title">تحدي التفحيط</div>
            </a>
            <a href="play.html?game=car3" class="game-card">
                <img src="https://picsum.photos/200/150?random=3" alt="الشاحنات العملاقة">
                <div class="game-title">الشاحنات العملاقة</div>
            </a>
        </div>

        <h2 style="margin-top: 25px;">💥 ألعاب أكشن ومغامرات</h2>
        <div class="games-grid">
            <a href="play.html?game=action1" class="game-card">
                <img src="https://picsum.photos/200/150?random=4" alt="قتال الشوارع">
                <div class="game-title">قتال الشوارع</div>
            </a>
            <a href="play.html?game=action2" class="game-card">
                <img src="https://picsum.photos/200/150?random=5" alt="مغامرات البطل">
                <div class="game-title">مغامرات البطل</div>
            </a>
            <a href="play.html?game=action3" class="game-card">
                <img src="https://picsum.photos/200/150?random=6" alt="حرب الزومبي">
                <div class="game-title">حرب الزومبي</div>
            </a>
        </div>

        <h2 style="margin-top: 25px;">⚽ ألعاب رياضة وكرة قدم</h2>
        <div class="games-grid">
            <a href="play.html?game=football1" class="game-card">
                <img src="https://picsum.photos/200/150?random=7" alt="دوري الركلات">
                <div class="game-title">دوري ركلات الترجيح</div>
            </a>
            <a href="play.html?game=football2" class="game-card">
                <img src="https://picsum.photos/200/150?random=8" alt="كرة السلة">
                <div class="game-title">تحدي كرة السلة</div>
            </a>
        </div>
    </main>

</body>
</html>
