<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games Zone - عالم الألعاب</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="main-theme">

    <header>
        <div class="logo">🎮 Games Zone</div>
        <input type="text" id="searchInput" onkeyup="searchGames()" placeholder="ابحث عن لعبتك المفضلة...">
    </header>

    <main class="container">
        
        <!-- قسم الألعاب القتالية والأكشن -->
        <section class="category-section action-section">
            <h2>⚔️ ألعاب القتال والأكشن</h2>
            <div class="games-grid">
                <a href="play.html?url=https://html5.gamedistribution.com/rvvAS308/&title=Stickman+Combat" class="game-card">
                    <img src="https://img.gamedistribution.com/rvvAS308-512x512.jpeg" alt="قتال العصي">
                    <h3>قتال العصي (Stickman)</h3>
                </a>
            </div>
        </section>

        <!-- قسم ألعاب السيارات والسرعة -->
        <section class="category-section racing-section">
            <h2>🏎️ ألعاب السيارات والسرعة</h2>
            <div class="games-grid">
                <a href="play.html?url=https://html5.gamedistribution.com/62497fb26a114f04a601e3b6107383da/&title=Street+Racer" class="game-card">
                    <img src="https://img.gamedistribution.com/62497fb26a114f04a601e3b6107383da-512x512.jpeg" alt="سباق شوارع">
                    <h3>سباق شوارع المحترفين</h3>
                </a>
            </div>
        </section>

    </main>

    <script>
        function searchGames() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let cards = document.getElementsByClassName('game-card');
            
            for (let i = 0; i < cards.length; i++) {
                let title = cards[i].getElementsByTagName('h3')[0].innerText.toLowerCase();
                cards[i].style.display = title.includes(input) ? "block" : "none";
            }
        }
    </script>
</body>
</html>
