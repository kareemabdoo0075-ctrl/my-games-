<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games Zone - عالم الألعاب</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="main-theme">

    <header>
        <div class="logo">🎮 Games Zone</div>
        <input type="text" placeholder="ابحث عن لعبتك المفضلة...">
    </header>

    <main class="container">
        
        <!-- قسم الألعاب القتالية والأكشن -->
        <section class="category-section action-section">
            <h2>⚔️ ألعاب القتال والأكشن</h2>
            <div class="games-grid">
                <a href="play.html?game=action1" class="game-card">
                    <img src="https://via.placeholder.com/300x180" alt="لعبة قتال 1">
                    <h3>معركة الأبطال</h3>
                </a>
                <a href="play.html?game=action2" class="game-card">
                    <img src="https://via.placeholder.com/300x180" alt="لعبة قتال 2">
                    <h3>قتال الشوارع</h3>
                </a>
            </div>
        </section>

        <!-- قسم ألعاب السيارات والسرعة -->
        <section class="category-section racing-section">
            <h2>🏎️ ألعاب السيارات والسرعة</h2>
            <div class="games-grid">
                <a href="play.html?game=racing1" class="game-card">
                    <img src="https://via.placeholder.com/300x180" alt="لعبة سباق 1">
                    <h3>سباق المحترفين</h3>
                </a>
            </div>
        </section>

    </main>

</body>
</html>
