<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تشغيل اللعبة - ألعابي</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; }
        body { background-color: #121318; color: white; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        header { width: 100%; background: #1c1d24; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #2d2f3b; }
        .back-btn { color: #ff4757; text-decoration: none; font-weight: bold; font-size: 1.1rem; }
        .game-wrapper { width: 100%; max-width: 900px; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        
        .iframe-container {
            position: relative;
            width: 100%;
            padding-bottom: 60%;
            height: 0;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }
        .iframe-container iframe {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none;
        }
        .controls { width: 100%; margin-top: 15px; display: flex; justify-content: space-between; align-items: center; }
        .btn-fullscreen { background: #ff4757; color: white; border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="back-btn">➔ العودة للرئيسية</a>
        <h3 id="gameTitle">🎮 جاري تحميل اللعبة...</h3>
    </header>

    <div class="game-wrapper">
        <div class="iframe-container" id="gameBox">
            <iframe id="gameFrame" src="" allowfullscreen></iframe>
        </div>
        
        <div class="controls">
            <h2 id="gameNameBelow">اللعبة</h2>
            <button class="btn-fullscreen" onclick="openFullscreen()">🖥️ شاشة كاملة</button>
        </div>
    </div>

    <script>
        const gamesData = {
            "car1": { name: "سباق السيارات الخارقة", url: "https://html5.gamedistribution.com/rvvAS48q61e149309831411586a11756/" },
            "car2": { name: "تحدي التفحيط", url: "https://html5.gamedistribution.com/f04c6328325a4d04a6012e684074b34d/" },
            "car3": { name: "الشاحنات العملاقة", url: "https://html5.gamedistribution.com/56a2be2d5a39498a9d18ce273ba5bbbe/" },
            "action1": { name: "قتال الشوارع", url: "https://html5.gamedistribution.com/d33de002a28148b39414bfcbef31df2d/" },
            "action2": { name: "مغامرات البطل", url: "https://html5.gamedistribution.com/bf96e21013f94bdca11e96a40c6c10eb/" },
            "action3": { name: "حرب الزومبي", url: "https://html5.gamedistribution.com/609d94fa25154ee4a034ee0b93bc71d3/" },
            "football1": { name: "دوري ركلات الترجيح", url: "https://html5.gamedistribution.com/c15b138531eb43efb672778ca0199120/" },
            "football2": { name: "تحدي كرة السلة", url: "https://html5.gamedistribution.com/3910906e579e43fa9d83dfebad656f5e/" }
        };

        const urlParams = new URLSearchParams(window.location.search);
        const gameID = urlParams.get('game') || 'car1';

        if (gamesData[gameID]) {
            document.getElementById('gameFrame').src = gamesData[gameID].url;
            document.getElementById('gameTitle').innerText = "🎮 " + gamesData[gameID].name;
            document.getElementById('gameNameBelow').innerText = gamesData[gameID].name;
        }

        function openFullscreen() {
            let elem = document.getElementById("gameBox");
            if (elem.requestFullscreen) { elem.requestFullscreen(); }
            else if (elem.webkitRequestFullscreen) { elem.webkitRequestFullscreen(); }
            else if (elem.msRequestFullscreen) { elem.msRequestFullscreen(); }
        }
    </script>
</body>
</html>
