<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تشغيل اللعبة - Games Zone</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0f0f1a; 
            color: #fff; 
            font-family: 'Segoe UI', sans-serif; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            overflow: hidden; 
        }
        header { 
            padding: 12px 20px; 
            background: rgba(255, 255, 255, 0.05); 
            backdrop-filter: blur(10px);
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .back-btn { 
            color: #00f2fe; 
            text-decoration: none; 
            font-weight: bold; 
            border: 1px solid #00f2fe; 
            padding: 6px 14px; 
            border-radius: 8px; 
            transition: 0.3s;
        }
        .back-btn:hover {
            background: #00f2fe;
            color: #000;
        }
        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="back-btn">⬅ العودة للرئيسية</a>
        <h3 id="game-title">جاري تحميل اللعبة...</h3>
    </header>

    <iframe id="game-iframe" src="" allowfullscreen></iframe>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const gameUrl = urlParams.get('url');
        const gameTitle = urlParams.get('title');

        if (gameUrl) {
            document.getElementById('game-iframe').src = gameUrl;
        }
        if (gameTitle) {
            document.getElementById('game-title').innerText = gameTitle;
        }
    </script>
</body>
</html>
